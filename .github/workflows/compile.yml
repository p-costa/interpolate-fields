name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v1
    - name: Install OpenMPI, gfortran and NumPy
      run: sudo apt-get update && sudo apt-get install gfortran libopenmpi-dev python3-numpy
    - name: Compile
      run: make -j
    - name: Test (debug build)
      run: make clean && make -j FFLAGS_DEBUG=1 FFLAGS_OPT=0 && python3 tests/run_tests.py
